<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Properties — NepalHomes</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .compare-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .compare-slot { background: white; border-radius: var(--radius-xl); border: 2px dashed var(--stone-200); padding: 20px; text-align: center; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: var(--transition); }
    .compare-slot.filled { border-style: solid; border-color: var(--terra-300); }
    .slot-img { width: 100%; height: 100px; object-fit: cover; border-radius: var(--radius); margin-bottom: 8px; }
    .slot-title { font-weight: 600; font-size: 0.85rem; color: var(--stone-800); text-align: left; }
    .slot-price { font-weight: 700; color: var(--terra-600); font-size: 0.9rem; }
    .slot-remove { font-size: 0.75rem; color: #dc2626; cursor: pointer; background: none; border: none; padding: 2px 8px; border-radius: var(--radius-sm); transition: var(--transition); }
    .slot-remove:hover { background: #fee2e2; }
    .slot-select { width: 100%; padding: 8px 12px; border-radius: var(--radius); border: 1.5px solid var(--stone-200); font-size: 0.83rem; background: var(--stone-50); cursor: pointer; }
    .compare-table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-sm); }
    .compare-table th { background: var(--stone-50); padding: 14px 16px; text-align: left; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--stone-500); border-bottom: 1px solid var(--stone-100); }
    .compare-table td { padding: 14px 16px; border-bottom: 1px solid var(--stone-50); font-size: 0.88rem; color: var(--stone-700); vertical-align: top; }
    .compare-table tr:last-child td { border-bottom: none; }
    .compare-table .row-label { font-weight: 600; color: var(--stone-500); font-size: 0.8rem; background: var(--stone-50); width: 140px; }
    .compare-table tr:hover td { background: var(--stone-50); }
    .compare-table tr:hover .row-label { background: var(--stone-100); }
    .feature-check { color: #15803d; font-size: 0.8rem; margin: 2px 0; display: flex; align-items: center; gap: 4px; }
    .empty-slot-cell { color: var(--stone-300); font-style: italic; font-size: 0.82rem; }
    .winner-badge { display: inline-block; background: #dcfce7; color: #14532d; font-size: 0.68rem; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
    @media (max-width: 768px) {
      .compare-slots { grid-template-columns: 1fr; }
      .compare-table { font-size: 0.8rem; }
      .compare-table td, .compare-table th { padding: 10px; }
    }
  </style>
</head>
<body>
<div id="navbar"></div>

<div class="container page-content">
  <div style="margin-bottom:24px;">
    <h1 style="font-size:1.6rem;margin-bottom:6px;">Compare Properties</h1>
    <p class="text-muted text-sm">Select up to 3 properties to compare side by side</p>
  </div>

  <!-- Slot selectors -->
  <div class="compare-slots" id="compareSlots"></div>

  <!-- Comparison table -->
  <div id="compareTableWrap"></div>
</div>

<div id="footer"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
  const selected = [null, null, null]; // 3 slots

  function getSelectedProps() {
    return selected.filter(Boolean);
  }

  function renderSlots() {
    const wrap = document.getElementById('compareSlots');
    wrap.innerHTML = selected.map((p, i) => {
      if (!p) {
        return `
          <div class="compare-slot" id="slot-${i}">
            <div style="font-size:1.8rem;margin-bottom:4px;">🏠</div>
            <p class="text-xs text-muted mb-2">Select a property to compare</p>
            <select class="slot-select" onchange="pickProperty(${i}, this.value)">
              <option value="">— Choose Property —</option>
              ${PROPERTIES.map(q => `<option value="${q.id}">${q.title} · ${q.city}</option>`).join('')}
            </select>
          </div>`;
      }
      return `
        <div class="compare-slot filled" id="slot-${i}">
          <img src="${p.image}" class="slot-img" alt="${p.title}">
          <div style="width:100%;text-align:left;">
            <div class="slot-title">${p.title}</div>
            <div class="slot-price">${formatPrice(p.price, p.status)}</div>
            <div style="font-size:0.75rem;color:var(--stone-400);margin-top:2px;">📍 ${p.city}</div>
          </div>
          <div style="width:100%;display:flex;gap:8px;margin-top:6px;">
            <a href="property.html?id=${p.id}" class="btn btn-secondary btn-sm" style="flex:1;text-align:center;">View</a>
            <button class="slot-remove btn btn-ghost btn-sm" onclick="removeProperty(${i})">✕ Remove</button>
          </div>
        </div>`;
    }).join('');
  }

  function pickProperty(slotIdx, idStr) {
    const id = Number(idStr);
    if (!id) { selected[slotIdx] = null; renderAll(); return; }
    // Prevent duplicates
    if (selected.some((p, i) => i !== slotIdx && p && p.id === id)) {
      alert('This property is already in another slot.');
      renderSlots();
      return;
    }
    selected[slotIdx] = PROPERTIES.find(p => p.id === id) || null;
    renderAll();
  }

  function removeProperty(slotIdx) {
    selected[slotIdx] = null;
    renderAll();
  }

  function renderTable() {
    const props = getSelectedProps();
    const wrap = document.getElementById('compareTableWrap');
    if (props.length < 2) {
      wrap.innerHTML = `
        <div style="text-align:center;padding:60px 20px;background:white;border-radius:var(--radius-xl);border:1px solid var(--stone-100);">
          <div style="font-size:2.5rem;margin-bottom:12px;">⚖️</div>
          <h3 style="color:var(--stone-600);">Select at least 2 properties to compare</h3>
          <p class="text-muted text-sm mt-2">Use the dropdowns above to pick properties</p>
        </div>`;
      return;
    }

    // Find cheapest price for winner badge
    const minPrice = Math.min(...props.map(p => p.price));
    const maxArea  = Math.max(...props.map(p => p.area || 0));
    const maxBeds  = Math.max(...props.map(p => p.beds || 0));

    const colHeader = props.map(p => `
      <th style="text-align:center;min-width:180px;">
        <div style="font-weight:700;font-size:0.9rem;">${p.title}</div>
        <div class="text-xs text-muted mt-1">📍 ${p.city}</div>
      </th>`).join('');

    const rows = [
      {
        label: 'Image',
        cells: props.map(p => `<td style="text-align:center;padding:10px;"><img src="${p.image}" style="width:100%;max-width:180px;height:110px;object-fit:cover;border-radius:var(--radius);" alt=""></td>`)
      },
      {
        label: 'Price',
        cells: props.map(p => `<td style="text-align:center;font-weight:700;color:var(--terra-600);">${formatPrice(p.price, p.status)}${p.price === minPrice ? '<span class="winner-badge">Lowest</span>' : ''}</td>`)
      },
      {
        label: 'Type',
        cells: props.map(p => `<td style="text-align:center;text-transform:capitalize;">${p.type}</td>`)
      },
      {
        label: 'Listing',
        cells: props.map(p => `<td style="text-align:center;"><span class="badge ${p.status==='for_rent'?'badge-rent':'badge-sale'}">${p.status==='for_rent'?'For Rent':'For Sale'}</span></td>`)
      },
      {
        label: 'Area',
        cells: props.map(p => `<td style="text-align:center;">${p.area ? p.area + ' ' + (p.areaUnit || 'aana') : '—'}${p.area && p.area === maxArea ? '<span class="winner-badge">Largest</span>' : ''}</td>`)
      },
      {
        label: 'Bedrooms',
        cells: props.map(p => `<td style="text-align:center;">${p.beds ? p.beds + ' beds' : '—'}${p.beds && p.beds === maxBeds ? '<span class="winner-badge">Most</span>' : ''}</td>`)
      },
      {
        label: 'Bathrooms',
        cells: props.map(p => `<td style="text-align:center;">${p.baths ? p.baths + ' baths' : '—'}</td>`)
      },
      {
        label: 'Location',
        cells: props.map(p => `<td style="text-align:center;">${[p.location, p.city, p.district].filter(Boolean).join(', ')}</td>`)
      },
      {
        label: 'Facing',
        cells: props.map(p => `<td style="text-align:center;">${p.facing || '—'}</td>`)
      },
      {
        label: 'Road Width',
        cells: props.map(p => `<td style="text-align:center;">${p.road || '—'}</td>`)
      },
      {
        label: 'Year Built',
        cells: props.map(p => `<td style="text-align:center;">${p.yearBuilt || '—'}</td>`)
      },
      {
        label: 'Amenities',
        cells: props.map(p => `<td>${(p.features || []).map(f => `<div class="feature-check">✓ ${f}</div>`).join('') || '<span class="empty-slot-cell">None listed</span>'}</td>`)
      },
      {
        label: 'Agent',
        cells: props.map(p => `<td style="text-align:center;font-size:0.82rem;">${p.agent ? p.agent.name : '—'}</td>`)
      },
      {
        label: '',
        cells: props.map(p => `<td style="text-align:center;"><a href="property.html?id=${p.id}" class="btn btn-primary btn-sm">View Details</a></td>`)
      },
    ];

    wrap.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="compare-table">
          <thead>
            <tr>
              <th class="row-label">Feature</th>
              ${colHeader}
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td class="row-label">${row.label}</td>
                ${row.cells.join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function renderAll() {
    renderSlots();
    renderTable();
  }

  renderAll();
</script>
</body>
</html>
